server:
  port: 8080

spring:
  application:
    name: social-wallet
  messages:
    basename: messages,ValidationMessages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/social_wallet}
    username: ${DB_USER:social_wallet}
    password: ${DB_PASSWORD:change_me}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Issuer URI de ton realm Keycloak local
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8082/realms/social-wallet}

# Ajouts spécifiques pour Keycloak / JWT
app:
  security:
    # JWK set URI pour récupérer la clé publique
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/social-wallet/protocol/openid-connect/certs}
    # Liste des issuers autorisés (utile pour dev Docker et localhost)
    allowed-issuers:
      - ${KEYCLOAK_ISSUER_EXTERNAL:http://localhost:8082/realms/social-wallet}
      - ${KEYCLOAK_ISSUER_INTERNAL:http://keycloak:8080/realms/social-wallet}
  identity:
    keycloak:
      base-url: ${KEYCLOAK_URL:http://localhost:8082}
      realm: ${KEYCLOAK_REALM:social-wallet}
      admin-realm: ${KEYCLOAK_ADMIN_REALM:master}
      admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
      admin-username: ${KEYCLOAK_ADMIN_USERNAME:admin}
      admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
      client-id: ${KEYCLOAK_CLIENT_ID:social-wallet-api}
      client-secret: ${KEYCLOAK_CLIENT_SECRET:}
      default-role: ${KEYCLOAK_DEFAULT_ROLE:USER}
    otp:
      ttl-seconds: ${OTP_TTL_SECONDS:300}
      max-attempts: ${OTP_MAX_ATTEMPTS:3}
      debug: ${OTP_DEBUG:true}
  openim:
    enabled: ${OPENIM_ENABLED:true}
    chat-base-url: ${OPENIM_CHAT_URL:http://localhost:10008}
    admin-base-url: ${OPENIM_ADMIN_URL:http://localhost:10009}
    admin-account: ${OPENIM_ADMIN_ACCOUNT:chatAdmin}
    admin-password-hash: ${OPENIM_ADMIN_PASSWORD_HASH:625031fc4e4f2de6b187e6bfa3697784}
    admin-version: ${OPENIM_ADMIN_VERSION:1.0.0}
    default-area-code: "${OPENIM_DEFAULT_AREA_CODE:+237}"
    super-code: ${OPENIM_SUPER_CODE:666666}
    platform: ${OPENIM_PLATFORM:5}
    admin-token-ttl-seconds: ${OPENIM_ADMIN_TOKEN_TTL_SECONDS:3600}
    password-salt: ${OPENIM_PASSWORD_SALT:change_me}
    device-id: ${OPENIM_DEVICE_ID:backend}
    repair-on-startup: ${OPENIM_REPAIR_ON_STARTUP:false}
  store:
    medusa:
      base-url: ${MEDUSA_BASE_URL:http://localhost:9000}
      publishable-key: ${MEDUSA_PUBLISHABLE_KEY:}
      admin-token: ${MEDUSA_ADMIN_TOKEN:}
      webhook-secret: ${MEDUSA_WEBHOOK_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: INFO

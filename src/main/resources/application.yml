server:
  port: 8080

spring:
  application:
    name: social-wallet
  messages:
    basename: messages,ValidationMessages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/social_wallet}
    username: ${DB_USER:social_wallet}
    password: ${DB_PASSWORD:change_me}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        "[format_sql]": true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8082/realms/social-wallet}

# Ajouts spécifiques pour Keycloak / JWT
app:
  security:
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/social-wallet/protocol/openid-connect/certs}
    allowed-issuers:
      - ${KEYCLOAK_ISSUER_EXTERNAL:http://localhost:8082/realms/social-wallet}
      - ${KEYCLOAK_ISSUER_INTERNAL:http://keycloak:8080/realms/social-wallet}

# Media module configuration
media:
  max-uploads-per-hour: 30
  soft-delete-grace-days: 30
  storage:
    bucket: ${DO_SPACES_BUCKET:sw-media}
    region: ${DO_SPACES_REGION:fra1}
    endpoint: ${DO_SPACES_ENDPOINT:https://fra1.digitaloceanspaces.com}
    access-key: ${DO_SPACES_ACCESS_KEY:}
    secret-key: ${DO_SPACES_SECRET_KEY:}
  imgproxy:
    base-url: ${IMGPROXY_BASE_URL:http://localhost:8081}
    key: ${IMGPROXY_KEY:}
    salt: ${IMGPROXY_SALT:}
    url-expiration-seconds: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    "[org.springframework.security]": INFO
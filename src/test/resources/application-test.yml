spring:
  datasource:
    url: jdbc:postgresql://localhost:${postgres.port}/testdb
    username: test
    password: test
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.auth-server-url}realms/social-wallet

# Media config pour les tests (valeurs factices, S3 est mocké via @MockBean)
media:
  max-uploads-per-hour: 30
  soft-delete-grace-days: 30
  storage:
    bucket: test-bucket
    region: us-east-1
    endpoint: https://s3.test.local
    access-key: test-key
    secret-key: test-secret
  imgproxy:
    base-url: https://cdn.test.local
    key: 736563726574
    salt: 73616c74
    url-expiration-seconds: 3600
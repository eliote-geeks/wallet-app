spring:
  datasource:
    url: jdbc:postgresql://localhost:${postgres.port}/testdb  # Testcontainers expose le port
    username: test
    password: test
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # Flyway gère le schéma

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.auth-server-url}realms/social-wallet  # Testcontainers expose l'URL
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082/realms/social-wallet

media:
  max-uploads-per-hour: 30
  soft-delete-grace-days: 30
  storage:
    bucket: test-bucket
    region: us-east-1
    endpoint: https://s3.test.local
    access-key: test-key
    secret-key: test-secret
  imgproxy:
    base-url: https://cdn.test.local
    key: 736563726574
    salt: 73616c74
    url-expiration-seconds: 3600
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: metricbeat
  labels:
    app.kubernetes.io/name: metricbeat
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: metricbeat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metricbeat
    spec:
      serviceAccountName: metricbeat
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      containers:
        - name: metricbeat
          image: docker.elastic.co/beats/metricbeat:8.13.4
          imagePullPolicy: IfNotPresent
          args: ["-e", "-c", "/usr/share/metricbeat/metricbeat.yml"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elastic-credentials
                  key: ELASTIC_PASSWORD
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /usr/share/metricbeat/metricbeat.yml
              subPath: metricbeat.yml
      volumes:
        - name: config
          configMap:
            name: metricbeat-config
            defaultMode: 0640

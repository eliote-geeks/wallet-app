apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-openwebui
  namespace: ai-dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ai-dev.79.137.32.27.nip.io
      secretName: ai-dev-tls
  rules:
    - host: ai-dev.79.137.32.27.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openwebui
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-litellm
  namespace: ai-dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ai-api-dev.79.137.32.27.nip.io
      secretName: ai-api-dev-tls
  rules:
    - host: ai-api-dev.79.137.32.27.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: litellm
                port:
                  number: 4000

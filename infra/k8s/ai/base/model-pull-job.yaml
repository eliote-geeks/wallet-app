apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull-qwen
  namespace: ai-dev
  labels:
    app.kubernetes.io/name: ollama-pull
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-pull
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull-model
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              until curl -fsS http://ollama.ai-dev.svc.cluster.local:11434/api/tags >/dev/null; do
                echo "waiting for ollama";
                sleep 5;
              done
              curl -fsS http://ollama.ai-dev.svc.cluster.local:11434/api/pull \
                -H 'Content-Type: application/json' \
                -d '{"name":"qwen2.5:7b-instruct-q4_K_M"}'

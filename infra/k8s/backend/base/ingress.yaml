apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: social-wallet-backend
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: api.dev.kobo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: social-wallet-backend
                port:
                  number: 80


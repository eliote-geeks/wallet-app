apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-wallet-keycloak
  labels:
    app.kubernetes.io/name: social-wallet-keycloak
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: social-wallet-keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: social-wallet-keycloak
    spec:
      serviceAccountName: social-wallet-keycloak
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:24.0.4
          imagePullPolicy: IfNotPresent
          args:
            - start
            - --http-enabled=true
            - --proxy-headers=xforwarded
            - --hostname-strict=false
            - --import-realm
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              value: social-wallet-postgres
            - name: KC_DB_URL_PORT
              value: "5432"
            - name: KC_DB_URL_DATABASE
              value: keycloak
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: social-wallet-platform-secrets
                  key: POSTGRES_KEYCLOAK_PASSWORD
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: JAVA_OPTS_APPEND
              value: "-XX:InitialRAMPercentage=30 -XX:MaxRAMPercentage=65 -Djava.awt.headless=true"
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: social-wallet-platform-secrets
                  key: KEYCLOAK_ADMIN_USERNAME
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: social-wallet-platform-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
          ports:
            - containerPort: 8080
              name: http
          startupProbe:
            httpGet:
              path: /realms/master/.well-known/openid-configuration
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /realms/master/.well-known/openid-configuration
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "3"
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import/social-wallet-realm.json
              subPath: social-wallet-realm.json
      volumes:
        - name: realm-import
          configMap:
            name: social-wallet-keycloak-realm

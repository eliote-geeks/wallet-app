apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-keycloak
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: social-wallet-keycloak
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: social-wallet-backend
      ports:
        - protocol: TCP
          port: 8080

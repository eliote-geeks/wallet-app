<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="{% block body_class %}{% endblock %}">
  {% if not hide_topbar %}
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">FP</span>
      <span class="brand-text">{{ app_name }}</span>
    </a>
    <nav>
      <a href="#pricing">Offres</a>
      <a href="#contact">Contact</a>
      {% if user %}
      <a href="/dashboard">Dashboard</a>
      <form action="/logout" method="post" class="inline-form">
        <button type="submit" class="link-btn">Logout</button>
      </form>
      {% else %}
      <a class="pill" href="{{ chat_ui_url }}" target="_blank" rel="noopener noreferrer">Login</a>
      {% endif %}
    </nav>
  </header>
  {% endif %}

  <main class="{% if fluid_layout %}container-fluid{% else %}container{% endif %} {% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>

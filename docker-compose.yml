services:
  db:
    image: postgres:16
    container_name: social-wallet-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-social_wallet}
      POSTGRES_USER: ${POSTGRES_USER:-social_wallet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: social-wallet-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: dev-file
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8082}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /realms/master/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \"200\"'"
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio
    container_name: social-wallet-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  imgproxy:
    image: darthsim/imgproxy:latest
    container_name: social-wallet-imgproxy
    ports:
      - "8081:8080"
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      IMGPROXY_USE_S3: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      IMGPROXY_S3_ENDPOINT: http://minio:9000
    depends_on:
      - minio

  app:
    build: .
    container_name: social-wallet-api
    environment:
      # --- Config DB ---
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-social_wallet}
      DB_USER: ${POSTGRES_USER:-social_wallet}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      
      # --- Config Keycloak ---
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8080/realms/social-wallet}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8080/realms/social-wallet/protocol/openid-connect/certs}
      
      # --- Media config MODIFIÉE ---
      # On utilise localhost ici pour que la signature soit générée pour localhost
      DO_SPACES_ENDPOINT: http://localhost:9000 
      DO_SPACES_ACCESS_KEY: minioadmin
      DO_SPACES_SECRET_KEY: minioadmin
      DO_SPACES_BUCKET: sw-media
      DO_SPACES_REGION: us-east-1
      IMGPROXY_BASE_URL: http://imgproxy:8080
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      
      # --- Store config ---
      MEDUSA_BASE_URL: ${MEDUSA_BASE_URL:-http://host.docker.internal:9000}
      MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY:-}
      MEDUSA_ADMIN_TOKEN: ${MEDUSA_ADMIN_TOKEN:-}
      MEDUSA_WEBHOOK_SECRET: ${MEDUSA_WEBHOOK_SECRET:-}
      STORE_PLATFORM_FEE_BPS: ${STORE_PLATFORM_FEE_BPS:-0}

      # --- Starter Spring Cloud AWS ---
      SPRING_CLOUD_AWS_REGION_STATIC: us-east-1
      SPRING_CLOUD_AWS_S3_REGION: us-east-1
      # On force aussi localhost ici pour la signature Spring Cloud
      SPRING_CLOUD_AWS_S3_ENDPOINT: http://localhost:9000
      SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY: minioadmin
      SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY: minioadmin

    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_started
      imgproxy:
        condition: service_started
        
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # AJOUT CRUCIAL : Dit à l'API que "localhost" dans son code, c'est le conteneur minio
      - "localhost:host-gateway" 
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  db-data:
  minio-data:
  keycloak-data:
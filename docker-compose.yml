services:
  db:
    image: postgres:16
    container_name: social-wallet-db
    environment:
      POSTGRES_DB: social_wallet
      POSTGRES_USER: social_wallet
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: social-wallet-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"

  app:
    build: .
    container_name: social-wallet-api
    environment:
      DB_URL: jdbc:postgresql://db:5432/social_wallet
      DB_USER: social_wallet
      DB_PASSWORD: change_me
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/social-wallet
    depends_on:
      - db
      - keycloak
    ports:
      - "8080:8080"

volumes:
  db-data:

name: backend-cd

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      target_env:
        description: "Environment to deploy (dev|prod)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_repo: ${{ steps.meta.outputs.image_repo }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_ref: ${{ steps.meta.outputs.image_ref }}
      target_env: ${{ steps.meta.outputs.target_env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deployment metadata
        id: meta
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TARGET_ENV="${{ inputs.target_env }}"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            TARGET_ENV="prod"
          else
            TARGET_ENV="dev"
          fi
          IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER}/wallet-app-backend"
          IMAGE_TAG="${GITHUB_SHA::7}"
          echo "target_env=${TARGET_ENV}" >> "$GITHUB_OUTPUT"
          echo "image_repo=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REPO}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.target_env }}-latest

  deploy-dev:
    if: ${{ needs.build-and-push.outputs.target_env == 'dev' }}
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [[ -z "${DEPLOY_SSH_KEY_B64}" || -z "${DEPLOY_HOST}" ]]; then
            echo "DEPLOY_SSH_KEY_B64 or DEPLOY_HOST missing"
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          printf "%s" "${DEPLOY_SSH_KEY_B64}" | base64 -d > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "${DEPLOY_HOST}" >> "$HOME/.ssh/known_hosts"

      - name: Prepare and apply namespaces + secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_SUPERUSER_PASSWORD: ${{ secrets.POSTGRES_SUPERUSER_PASSWORD }}
          POSTGRES_APP_PASSWORD: ${{ secrets.POSTGRES_APP_PASSWORD }}
          POSTGRES_KEYCLOAK_PASSWORD: ${{ secrets.POSTGRES_KEYCLOAK_PASSWORD }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_RETENTION_DAYS: ${{ secrets.BACKUP_RETENTION_DAYS }}
          KEYCLOAK_ISSUER_URI: ${{ secrets.KEYCLOAK_ISSUER_URI }}
          KEYCLOAK_JWK_SET_URI: ${{ secrets.KEYCLOAK_JWK_SET_URI }}
          KEYCLOAK_ISSUER_EXTERNAL: ${{ secrets.KEYCLOAK_ISSUER_EXTERNAL }}
          KEYCLOAK_ISSUER_INTERNAL: ${{ secrets.KEYCLOAK_ISSUER_INTERNAL }}
          KEYCLOAK_URL: ${{ secrets.KEYCLOAK_URL }}
          KEYCLOAK_REALM: ${{ secrets.KEYCLOAK_REALM }}
          KEYCLOAK_ADMIN_REALM: ${{ secrets.KEYCLOAK_ADMIN_REALM }}
          KEYCLOAK_ADMIN_CLIENT_ID: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_ID }}
          KEYCLOAK_ADMIN_USERNAME: ${{ secrets.KEYCLOAK_ADMIN_USERNAME }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          KEYCLOAK_CLIENT_ID: ${{ secrets.KEYCLOAK_CLIENT_ID }}
          KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
          MEDUSA_BASE_URL: ${{ secrets.MEDUSA_BASE_URL }}
          MEDUSA_PUBLISHABLE_KEY: ${{ secrets.MEDUSA_PUBLISHABLE_KEY }}
          MEDUSA_ADMIN_TOKEN: ${{ secrets.MEDUSA_ADMIN_TOKEN }}
          MEDUSA_WEBHOOK_SECRET: ${{ secrets.MEDUSA_WEBHOOK_SECRET }}
          STORE_PLATFORM_FEE_BPS: ${{ secrets.STORE_PLATFORM_FEE_BPS }}
          ELASTIC_PASSWORD: ${{ secrets.ELASTIC_PASSWORD }}
          KIBANA_ENCRYPTION_KEY: ${{ secrets.KIBANA_ENCRYPTION_KEY }}
          APM_SECRET_TOKEN: ${{ secrets.APM_SECRET_TOKEN }}
        run: |
          : "${DEPLOY_USER:=ubuntu}"
          : "${DB_URL:=jdbc:postgresql://social-wallet-postgres:5432/social_wallet}"
          : "${DB_USER:=social_wallet}"
          : "${KEYCLOAK_ISSUER_URI:=http://social-wallet-keycloak:8080/realms/social-wallet}"
          : "${KEYCLOAK_JWK_SET_URI:=http://social-wallet-keycloak:8080/realms/social-wallet/protocol/openid-connect/certs}"
          : "${KEYCLOAK_ISSUER_EXTERNAL:=https://api-dev.kobo.79.137.32.27.nip.io/realms/social-wallet}"
          : "${KEYCLOAK_ISSUER_INTERNAL:=http://social-wallet-keycloak:8080/realms/social-wallet}"
          : "${KEYCLOAK_URL:=http://social-wallet-keycloak:8080}"
          : "${KEYCLOAK_REALM:=social-wallet}"
          : "${KEYCLOAK_ADMIN_REALM:=master}"
          : "${KEYCLOAK_ADMIN_CLIENT_ID:=admin-cli}"
          : "${KEYCLOAK_CLIENT_ID:=social-wallet-api}"
          : "${BACKUP_RETENTION_DAYS:=14}"

          for required in DB_PASSWORD POSTGRES_SUPERUSER_PASSWORD POSTGRES_APP_PASSWORD POSTGRES_KEYCLOAK_PASSWORD BACKUP_ENCRYPTION_KEY KEYCLOAK_ADMIN_USERNAME KEYCLOAK_ADMIN_PASSWORD ELASTIC_PASSWORD KIBANA_ENCRYPTION_KEY APM_SECRET_TOKEN DEPLOY_HOST; do
            if [[ -z "${!required}" ]]; then
              echo "Missing required secret: ${required}"
              exit 1
            fi
          done

          kubectl create namespace kobo-dev --dry-run=client -o yaml | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo kubectl apply -f -'
          kubectl create namespace observability --dry-run=client -o yaml | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo kubectl apply -f -'

          kubectl -n kobo-dev create secret generic social-wallet-platform-secrets \
            --from-literal=POSTGRES_SUPERUSER_PASSWORD="${POSTGRES_SUPERUSER_PASSWORD}" \
            --from-literal=POSTGRES_APP_PASSWORD="${POSTGRES_APP_PASSWORD}" \
            --from-literal=POSTGRES_KEYCLOAK_PASSWORD="${POSTGRES_KEYCLOAK_PASSWORD}" \
            --from-literal=BACKUP_ENCRYPTION_KEY="${BACKUP_ENCRYPTION_KEY}" \
            --from-literal=BACKUP_RETENTION_DAYS="${BACKUP_RETENTION_DAYS}" \
            --from-literal=KEYCLOAK_ADMIN_USERNAME="${KEYCLOAK_ADMIN_USERNAME}" \
            --from-literal=KEYCLOAK_ADMIN_PASSWORD="${KEYCLOAK_ADMIN_PASSWORD}" \
            --dry-run=client -o yaml | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo kubectl apply -f -'

          kubectl -n kobo-dev create secret generic social-wallet-backend-secrets \
            --from-literal=DB_URL="${DB_URL}" \
            --from-literal=DB_USER="${DB_USER}" \
            --from-literal=DB_PASSWORD="${DB_PASSWORD}" \
            --from-literal=KEYCLOAK_ISSUER_URI="${KEYCLOAK_ISSUER_URI}" \
            --from-literal=KEYCLOAK_JWK_SET_URI="${KEYCLOAK_JWK_SET_URI}" \
            --from-literal=KEYCLOAK_ISSUER_EXTERNAL="${KEYCLOAK_ISSUER_EXTERNAL}" \
            --from-literal=KEYCLOAK_ISSUER_INTERNAL="${KEYCLOAK_ISSUER_INTERNAL}" \
            --from-literal=KEYCLOAK_URL="${KEYCLOAK_URL}" \
            --from-literal=KEYCLOAK_REALM="${KEYCLOAK_REALM}" \
            --from-literal=KEYCLOAK_ADMIN_REALM="${KEYCLOAK_ADMIN_REALM}" \
            --from-literal=KEYCLOAK_ADMIN_CLIENT_ID="${KEYCLOAK_ADMIN_CLIENT_ID}" \
            --from-literal=KEYCLOAK_ADMIN_USERNAME="${KEYCLOAK_ADMIN_USERNAME}" \
            --from-literal=KEYCLOAK_ADMIN_PASSWORD="${KEYCLOAK_ADMIN_PASSWORD}" \
            --from-literal=KEYCLOAK_CLIENT_ID="${KEYCLOAK_CLIENT_ID}" \
            --from-literal=KEYCLOAK_CLIENT_SECRET="${KEYCLOAK_CLIENT_SECRET}" \
            --from-literal=MEDUSA_BASE_URL="${MEDUSA_BASE_URL}" \
            --from-literal=MEDUSA_PUBLISHABLE_KEY="${MEDUSA_PUBLISHABLE_KEY}" \
            --from-literal=MEDUSA_ADMIN_TOKEN="${MEDUSA_ADMIN_TOKEN}" \
            --from-literal=MEDUSA_WEBHOOK_SECRET="${MEDUSA_WEBHOOK_SECRET}" \
            --from-literal=STORE_PLATFORM_FEE_BPS="${STORE_PLATFORM_FEE_BPS}" \
            --dry-run=client -o yaml | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo kubectl apply -f -'

          kubectl -n observability create secret generic elastic-credentials \
            --from-literal=ELASTIC_PASSWORD="${ELASTIC_PASSWORD}" \
            --from-literal=KIBANA_ENCRYPTION_KEY="${KIBANA_ENCRYPTION_KEY}" \
            --from-literal=APM_SECRET_TOKEN="${APM_SECRET_TOKEN}" \
            --dry-run=client -o yaml | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo kubectl apply -f -'

      - name: Apply manifests and rollout
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          : "${DEPLOY_USER:=ubuntu}"
          kubectl kustomize infra/k8s/platform/overlays/dev | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo kubectl apply -f -'
          kubectl kustomize infra/k8s/observability/overlays/dev | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo kubectl apply -f -'
          kubectl kustomize infra/k8s/backend/overlays/dev | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo kubectl apply -f -'
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo kubectl -n kobo-dev rollout restart deployment/social-wallet-backend && sudo kubectl -n kobo-dev rollout status deployment/social-wallet-backend --timeout=300s'

  deploy-prod:
    if: ${{ needs.build-and-push.outputs.target_env == 'prod' }}
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [[ -z "${DEPLOY_SSH_KEY_B64}" || -z "${DEPLOY_HOST}" ]]; then
            echo "DEPLOY_SSH_KEY_B64 or DEPLOY_HOST missing"
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          printf "%s" "${DEPLOY_SSH_KEY_B64}" | base64 -d > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "${DEPLOY_HOST}" >> "$HOME/.ssh/known_hosts"

      - name: Prepare and apply namespaces + secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_SUPERUSER_PASSWORD: ${{ secrets.POSTGRES_SUPERUSER_PASSWORD }}
          POSTGRES_APP_PASSWORD: ${{ secrets.POSTGRES_APP_PASSWORD }}
          POSTGRES_KEYCLOAK_PASSWORD: ${{ secrets.POSTGRES_KEYCLOAK_PASSWORD }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_RETENTION_DAYS: ${{ secrets.BACKUP_RETENTION_DAYS }}
          KEYCLOAK_ISSUER_URI: ${{ secrets.KEYCLOAK_ISSUER_URI }}
          KEYCLOAK_JWK_SET_URI: ${{ secrets.KEYCLOAK_JWK_SET_URI }}
          KEYCLOAK_ISSUER_EXTERNAL: ${{ secrets.KEYCLOAK_ISSUER_EXTERNAL }}
          KEYCLOAK_ISSUER_INTERNAL: ${{ secrets.KEYCLOAK_ISSUER_INTERNAL }}
          KEYCLOAK_URL: ${{ secrets.KEYCLOAK_URL }}
          KEYCLOAK_REALM: ${{ secrets.KEYCLOAK_REALM }}
          KEYCLOAK_ADMIN_REALM: ${{ secrets.KEYCLOAK_ADMIN_REALM }}
          KEYCLOAK_ADMIN_CLIENT_ID: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_ID }}
          KEYCLOAK_ADMIN_USERNAME: ${{ secrets.KEYCLOAK_ADMIN_USERNAME }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          KEYCLOAK_CLIENT_ID: ${{ secrets.KEYCLOAK_CLIENT_ID }}
          KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
          MEDUSA_BASE_URL: ${{ secrets.MEDUSA_BASE_URL }}
          MEDUSA_PUBLISHABLE_KEY: ${{ secrets.MEDUSA_PUBLISHABLE_KEY }}
          MEDUSA_ADMIN_TOKEN: ${{ secrets.MEDUSA_ADMIN_TOKEN }}
          MEDUSA_WEBHOOK_SECRET: ${{ secrets.MEDUSA_WEBHOOK_SECRET }}
          STORE_PLATFORM_FEE_BPS: ${{ secrets.STORE_PLATFORM_FEE_BPS }}
          ELASTIC_PASSWORD: ${{ secrets.ELASTIC_PASSWORD }}
          KIBANA_ENCRYPTION_KEY: ${{ secrets.KIBANA_ENCRYPTION_KEY }}
          APM_SECRET_TOKEN: ${{ secrets.APM_SECRET_TOKEN }}
        run: |
          : "${DEPLOY_USER:=ubuntu}"
          : "${DB_URL:=jdbc:postgresql://social-wallet-postgres:5432/social_wallet}"
          : "${DB_USER:=social_wallet}"
          : "${KEYCLOAK_ISSUER_URI:=http://social-wallet-keycloak:8080/realms/social-wallet}"
          : "${KEYCLOAK_JWK_SET_URI:=http://social-wallet-keycloak:8080/realms/social-wallet/protocol/openid-connect/certs}"
          : "${KEYCLOAK_ISSUER_EXTERNAL:=https://api.kobo.your-domain.tld/realms/social-wallet}"
          : "${KEYCLOAK_ISSUER_INTERNAL:=http://social-wallet-keycloak:8080/realms/social-wallet}"
          : "${KEYCLOAK_URL:=http://social-wallet-keycloak:8080}"
          : "${KEYCLOAK_REALM:=social-wallet}"
          : "${KEYCLOAK_ADMIN_REALM:=master}"
          : "${KEYCLOAK_ADMIN_CLIENT_ID:=admin-cli}"
          : "${KEYCLOAK_CLIENT_ID:=social-wallet-api}"
          : "${BACKUP_RETENTION_DAYS:=14}"

          for required in DB_PASSWORD POSTGRES_SUPERUSER_PASSWORD POSTGRES_APP_PASSWORD POSTGRES_KEYCLOAK_PASSWORD BACKUP_ENCRYPTION_KEY KEYCLOAK_ADMIN_USERNAME KEYCLOAK_ADMIN_PASSWORD ELASTIC_PASSWORD KIBANA_ENCRYPTION_KEY APM_SECRET_TOKEN DEPLOY_HOST; do
            if [[ -z "${!required}" ]]; then
              echo "Missing required secret: ${required}"
              exit 1
            fi
          done

          kubectl create namespace kobo-prod --dry-run=client -o yaml | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo kubectl apply -f -'
          kubectl create namespace observability --dry-run=client -o yaml | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo kubectl apply -f -'

          kubectl -n kobo-prod create secret generic social-wallet-platform-secrets \
            --from-literal=POSTGRES_SUPERUSER_PASSWORD="${POSTGRES_SUPERUSER_PASSWORD}" \
            --from-literal=POSTGRES_APP_PASSWORD="${POSTGRES_APP_PASSWORD}" \
            --from-literal=POSTGRES_KEYCLOAK_PASSWORD="${POSTGRES_KEYCLOAK_PASSWORD}" \
            --from-literal=BACKUP_ENCRYPTION_KEY="${BACKUP_ENCRYPTION_KEY}" \
            --from-literal=BACKUP_RETENTION_DAYS="${BACKUP_RETENTION_DAYS}" \
            --from-literal=KEYCLOAK_ADMIN_USERNAME="${KEYCLOAK_ADMIN_USERNAME}" \
            --from-literal=KEYCLOAK_ADMIN_PASSWORD="${KEYCLOAK_ADMIN_PASSWORD}" \
            --dry-run=client -o yaml | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo kubectl apply -f -'

          kubectl -n kobo-prod create secret generic social-wallet-backend-secrets \
            --from-literal=DB_URL="${DB_URL}" \
            --from-literal=DB_USER="${DB_USER}" \
            --from-literal=DB_PASSWORD="${DB_PASSWORD}" \
            --from-literal=KEYCLOAK_ISSUER_URI="${KEYCLOAK_ISSUER_URI}" \
            --from-literal=KEYCLOAK_JWK_SET_URI="${KEYCLOAK_JWK_SET_URI}" \
            --from-literal=KEYCLOAK_ISSUER_EXTERNAL="${KEYCLOAK_ISSUER_EXTERNAL}" \
            --from-literal=KEYCLOAK_ISSUER_INTERNAL="${KEYCLOAK_ISSUER_INTERNAL}" \
            --from-literal=KEYCLOAK_URL="${KEYCLOAK_URL}" \
            --from-literal=KEYCLOAK_REALM="${KEYCLOAK_REALM}" \
            --from-literal=KEYCLOAK_ADMIN_REALM="${KEYCLOAK_ADMIN_REALM}" \
            --from-literal=KEYCLOAK_ADMIN_CLIENT_ID="${KEYCLOAK_ADMIN_CLIENT_ID}" \
            --from-literal=KEYCLOAK_ADMIN_USERNAME="${KEYCLOAK_ADMIN_USERNAME}" \
            --from-literal=KEYCLOAK_ADMIN_PASSWORD="${KEYCLOAK_ADMIN_PASSWORD}" \
            --from-literal=KEYCLOAK_CLIENT_ID="${KEYCLOAK_CLIENT_ID}" \
            --from-literal=KEYCLOAK_CLIENT_SECRET="${KEYCLOAK_CLIENT_SECRET}" \
            --from-literal=MEDUSA_BASE_URL="${MEDUSA_BASE_URL}" \
            --from-literal=MEDUSA_PUBLISHABLE_KEY="${MEDUSA_PUBLISHABLE_KEY}" \
            --from-literal=MEDUSA_ADMIN_TOKEN="${MEDUSA_ADMIN_TOKEN}" \
            --from-literal=MEDUSA_WEBHOOK_SECRET="${MEDUSA_WEBHOOK_SECRET}" \
            --from-literal=STORE_PLATFORM_FEE_BPS="${STORE_PLATFORM_FEE_BPS}" \
            --dry-run=client -o yaml | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo kubectl apply -f -'

          kubectl -n observability create secret generic elastic-credentials \
            --from-literal=ELASTIC_PASSWORD="${ELASTIC_PASSWORD}" \
            --from-literal=KIBANA_ENCRYPTION_KEY="${KIBANA_ENCRYPTION_KEY}" \
            --from-literal=APM_SECRET_TOKEN="${APM_SECRET_TOKEN}" \
            --dry-run=client -o yaml | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo kubectl apply -f -'

      - name: Apply manifests and rollout
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          : "${DEPLOY_USER:=ubuntu}"
          kubectl kustomize infra/k8s/platform/overlays/prod | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo kubectl apply -f -'
          kubectl kustomize infra/k8s/observability/overlays/prod | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo kubectl apply -f -'
          kubectl kustomize infra/k8s/backend/overlays/prod | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo kubectl apply -f -'
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo kubectl -n kobo-prod rollout restart deployment/social-wallet-backend && sudo kubectl -n kobo-prod rollout status deployment/social-wallet-backend --timeout=300s'
